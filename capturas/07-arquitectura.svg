<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Arquitectura del stack multi-contenedor</title>
<desc>Diagrama mostrando el navegador conectándose a Nginx, que enruta a Joomla, Jupyter y Grafana en frontend_net, los cuales se conectan a PostgreSQL en backend_net.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="520" fill="#ffffff"/>

<rect x="20" y="115" width="640" height="230" rx="16" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/>
<text x="35" y="142" font-family="sans-serif" font-size="12" fill="#5F5E5A">frontend_net</text>

<rect x="20" y="360" width="640" height="145" rx="16" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/>
<text x="35" y="387" font-family="sans-serif" font-size="12" fill="#5F5E5A">backend_net</text>

<g>
<rect x="210" y="30" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="320" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Navegador</text>
<text x="320" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">Cliente HTTP</text>
</g>

<line x1="320" y1="86" x2="320" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="335" y="118" font-family="sans-serif" font-size="12" fill="#5F5E5A">puerto 80</text>

<g>
<rect x="220" y="150" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="320" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Nginx</text>
<text x="320" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">Proxy inverso</text>
</g>

<line x1="320" y1="206" x2="320" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320 206 L320 232 L130 232 L130 260" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320 206 L320 232 L510 232 L510 260" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="45" y="260" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="282" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Joomla</text>
<text x="130" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">CMS (Apache)</text>
</g>

<g>
<rect x="235" y="260" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="320" y="282" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Jupyter</text>
<text x="320" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Notebook</text>
</g>

<g>
<rect x="425" y="260" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="510" y="282" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Grafana</text>
<text x="510" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Paneles</text>
</g>

<path d="M130 316 L130 400 L260 400 L260 430" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="316" x2="320" y2="430" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M510 316 L510 400 L380 400 L380 430" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="230" y="430" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="320" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">PostgreSQL</text>
<text x="320" y="470" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Base de datos</text>
</g>
</svg>
